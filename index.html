function renderHistory(){let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');let t=ui[lang];if($('#histTitle'))$('#histTitle').textContent=t.histTitle;if($('#clearHist'))$('#clearHist').textContent=t.histClear;if(!h.length){if($('#histList'))$('#histList').innerHTML=`<p class="note">${t.histEmpty}</p>`;return}if($('#histList'))$('#histList').innerHTML=h.map((item,idx)=>{let d=new Date(item.date||Date.now());let dateStr=d.toLocaleDateString(lang==='ar'?'ar-EG':'fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});let textEsc=(item.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');let typeBadge=item.type==='scam'?'🚨':(item.type==='health'?'🩺':'🔍');return `<div class="history-item" onclick="loadHistoryItem(${idx})"><div><strong>${typeBadge} ${textEsc}</strong></div><small style="color:#888">${dateStr}</small></div>`}).join('')}

function stats(){let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');$('#checks').textContent=h.length;$('#skills').textContent=localStorage.getItem('dalil-skills')||0;renderHistory()}
function translate(next){lang=next;localStorage.setItem('dalil-language',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';let t=ui[lang],e=extra[lang];$('#brand').textContent=t.brand;$('#lang').textContent=t.toggle;$('#eyebrow').textContent=t.eyebrow;$('#title').innerHTML=t.title;$('#intro').textContent=t.intro;$('#claimLabel').textContent=t.label;claim.placeholder=t.placeholder;$('#go').textContent=t.go;$('#example').textContent=t.example;if($('#btnOcr'))$('#btnOcr').textContent=t.btnOcr;if($('#btnReportScam'))$('#btnReportScam').textContent=t.reportBtn;if($('#reportTitle'))$('#reportTitle').textContent=t.reportTitle;if($('#reportSubtitle'))$('#reportSubtitle').textContent=t.reportSubtitle;if($('#btnSendReport'))$('#btnSendReport').textContent=t.reportSend;if($('#btnCancelReport'))$('#btnCancelReport').textContent=t.reportCancel;$('#privacy').textContent=t.privacy;$('#resultLabel').textContent=t.result;$('#confidence').innerHTML=t.confidence;$('#knownTitle').textContent=t.known;$('#riskTitle').textContent=t.risk;$('#missingTitle').textContent=t.missing;$('#sourcesTitle').textContent=t.sources;$('#linkTitle').textContent=e.linkTitle;$('#replyTitle').textContent=e.replyTitle;$('#copyReply').textContent=e.copy;$('#warning').textContent=t.warning;$('#lessonLabel').textContent=t.lesson;$('#reset').textContent=t.reset;$('#checksLabel').textContent=t.checks;$('#skillsLabel').textContent=t.skills;$('#streakLabel').textContent=t.streak;$('#fbTitle').textContent=t.fbTitle;$('#fbUseful').textContent=t.fbUseful;$('#fbIncorrect').textContent=t.fbIncorrect;$('#fbUncertain').textContent=t.fbUncertain;$('#fbMsg').textContent='';feedback.textContent='';if(active)render(active)}
function inspectLinks(text){let e=extra[lang],found=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/gi)||[];found=[...new Set(found.map(x=>x.replace(/[),.;!?،؛]+$/,'')))];if(!found.length){$('#linkList').innerHTML=`<p class="note">${e.noLink}</p>`;return 0}let totalRisk=0;$('#linkList').innerHTML=found.map(raw=>{try{let value=/^https?:/i.test(raw)?raw:'https://'+raw,url=new URL(value),host=url.hostname.toLowerCase(),flags=[],official=officialDomains.some(d=>host===d||host.endsWith('.'+d));if(url.protocol==='http:'){flags.push([e.http,'risk']);totalRisk++}else flags.push([e.https,'safe']);if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host)){flags.push([e.ip,'risk']);totalRisk++}if(host.includes('xn--')){flags.push([e.puny,'risk']);totalRisk++}if(shorteners.includes(host)){flags.push([e.short,'risk']);totalRisk++}if(raw.includes('@')){flags.push([e.at,'risk']);totalRisk++}if(host.length>35){flags.push([e.long,'risk']);totalRisk++}flags.push([official?e.official:e.unknown,official?'safe':'']);return `<div class="urlrow"><div class="domain">${host}</div><div class="badges">${flags.map(f=>`<span class="badge ${f[1]}">${f[0]}</span>`).join('')}</div></div>`}catch{return ''}}).join('');return totalRisk}
function render(key){active=key;let s=cases[key][lang],t=ui[lang],e=extra[lang];$('#resultTitle').textContent=s.title;$('#verdict').textContent=s.verdict;$('#knownText').textContent=s.facts[0];$('#riskText').textContent=s.facts[1];$('#missingText').textContent=s.facts[2];$('#question').textContent=s.question;['#choice1','#choice2','#choice3'].forEach((id,i)=>$(id).textContent=s.choices[i]);$('#sourceList').innerHTML=s.sources.map(x=>`<div class="source"><div><strong>${x[0]}</strong><br><small>${x[2]}</small></div><a target="_blank" rel="noopener" href="${x[1]}">${t.open} ↗</a></div>`).join('');let risks=inspectLinks(claim.value);$('#replyText').textContent=(key==='scam'||risks>0)?e.replyRisk:e.replySafe;$('#copyReply').textContent=e.copy}
function firstLink(text){if(text)text=text.replace(/(https?:\/\/[^\s<>'"\n]+)-\s*[\r\n]+\s*([a-zA-Z0-9\-]+\.[a-zA-Z]{2,})/gi,'$1$2').replace(/(https?:\/\/[^\s<>'"\n]+)\s*[\r\n]+\s*([a-zA-Z0-9\-]+\.[a-zA-Z]{2,})/gi,'$1/$2');let found=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/i);if(!found)return null;let raw=found[0].replace(/[),.;!?،؛]+$/,'');return /^https?:/i.test(raw)?raw:'https://'+raw}
// api-result.js — Dynamic verdict updater driven by VirusTotal / typosquatting API data
// Called by checkLive() after each API response and by translate() on language switch.

function applyApiResult(data) {
  var isFr = (typeof lang !== 'undefined') ? lang === 'fr' : true;
  var d = data.domain || (isFr ? 'ce domaine' : 'هذا النطاق');
  var title = '', verdict = '', badge = '', label = '', reply = '';

  // Typosquatting / Usurpation takes precedence over VirusTotal status
  if (data.typosquatting && data.typosquatting.suspected) {
    var t = data.typosquatting.targetOfficialDomain;
    title  = isFr ? '🚨 Usurpation d\'identité détectée' : '🚨 انتحال هوية مكتشف';
    verdict = isFr
      ? 'Le domaine « ' + d + ' » imite le site officiel « ' + t + ' ». Technique classique de phishing — n\'entrez aucun identifiant sur ce site.'
      : 'النطاق « ' + d + ' » يُقلّد الموقع الرسمي « ' + t + ' ». تقنية تصيّد — لا تُدخل أي بيانات على هذا الموقع.';
    badge  = isFr ? '🔴<br>Danger' : '🔴<br>خطر';
    label  = isFr ? '● Usurpation détectée' : '● انتحال مكتشف';
    reply  = isFr
      ? 'Attention : le lien « ' + d + ' » imite le site officiel « ' + t + ' ». C\'est un faux site ! Ne clique pas et ne partage aucun code.'
      : 'تنبيه: الرابط « ' + d + ' » يقلد الموقع الرسمي « ' + t + ' ». هذا موقع مزيف! لا تضغط عليه ولا ترسل أي رمز.';

    // Update urlrow pill badge directly
    var badgeEls = document.querySelectorAll('.badges .badge');
    badgeEls.forEach(function(el) {
      if (el.textContent.includes('Domaine non reconnu') || el.textContent.includes('نطاق غير معروف')) {
        el.className = 'badge risk';
        el.textContent = isFr ? '⚠️ Usurpation : imite ' + t : '⚠️ انتحال : يقلد ' + t;
      }
    });

  } else if (data.status === 'malicious') {
    var n = (data.stats && data.stats.malicious) || '?';
    title  = isFr ? '🚨 Lien malveillant confirmé' : '🚨 رابط ضار مؤكد';
    verdict = isFr
      ? 'VirusTotal signale le domaine « ' + d + ' » comme malveillant (' + n + ' moteur(s) de détection). N\'ouvrez pas ce lien et ne partagez aucune donnée personnelle.'
      : 'يُعلن VirusTotal أن النطاق « ' + d + ' » ضار (' + n + ' محرك). لا تفتح هذا الرابط ولا تشارك أي بيانات.';
    badge  = isFr ? '🔴<br>Danger' : '🔴<br>خطر';
    label  = '● VirusTotal Live';
    reply  = isFr
      ? 'Attention : le lien « ' + d + ' » a été identifié comme malveillant par VirusTotal (' + n + ' moteur(s)). Ne clique pas et ne partage aucun code !'
      : 'تنبيه: تم تأكيد أن الرابط « ' + d + ' » ضار عبر فحص VirusTotal (' + n + ' محرك). لا تضغط عليه ولا ترسل أي رمز!';

  } else if (data.status === 'suspicious') {
    var n = (data.stats && data.stats.suspicious) || '?';
    title  = isFr ? '⚠️ Lien suspect' : '⚠️ رابط مشبوه';
    verdict = isFr
      ? '« ' + d + ' » est signalé suspect par ' + n + ' moteur(s) VirusTotal. Évitez de cliquer et vérifiez l\'expéditeur par une autre voie.'
      : '« ' + d + ' » مشبوه وفق ' + n + ' محرك(ات) VirusTotal. تجنّب الضغط عليه.';
    badge  = isFr ? '🟡<br>Suspect' : '🟡<br>مشبوه';
    label  = '● VirusTotal Live';
    reply  = isFr
      ? 'Attention : le domaine « ' + d + ' » est signalé comme suspect. Prudence, ne saisis aucun identifiant sur ce site.'
      : 'تنبيه: النطاق « ' + d + ' » مصنف كمشبوه. كن حذرًا ولا تدخل أي بيانات.';

  } else if (data.status === 'no_detection') {
    title  = isFr ? '✅ Aucun signal d\'alerte' : '✅ لا إنذارات';
    verdict = isFr
      ? 'VirusTotal ne détecte rien de malveillant sur le domaine « ' + d + ' ». Restez vigilant : l\'absence de détection ne garantit pas la sécurité.'
      : 'لا يكشف VirusTotal شيئًا ضارًا على النطاق « ' + d + ' ». الغياب لا يضمن الأمان — ابقَ حذرًا.';
    badge  = isFr ? '🟢<br>Propre' : '🟢<br>نظيف';
    label  = '● VirusTotal Live';

  } else {
    // No data or unknown status — keep local analysis label
    label = isFr ? '● Analyse locale' : '● تحليل محلي';
    document.querySelector('#resultLabel').textContent = label;
    return;
  }

  document.querySelector('#resultTitle').textContent = title;
  document.querySelector('#verdict').textContent = verdict;
  document.querySelector('#confidence').innerHTML = badge;
  document.querySelector('#resultLabel').textContent = label;
  if (reply && document.querySelector('#replyText')) {
    document.querySelector('#replyText').textContent = reply;
  }
}

async function checkLive(candidate){let box=$('#liveStatus');if(!candidate){box.className='live';box.textContent=lang==='ar'?'أضف رابطًا لإجراء فحص مباشر.':'Ajoute un lien pour lancer la vérification en direct.';return}box.className='live checking';box.textContent=lang==='ar'?'جارٍ سؤال خدمة السمعة…':'Consultation du service de réputation…';try{let response=await fetch('/api/reputation?url='+encodeURIComponent(candidate),{headers:{accept:'application/json'}});if(!response.ok)throw new Error('unavailable');let data=await response.json();apiData=data;if(typeof applyApiResult==='function')applyApiResult(data);let lines=[];if(data.unshortened&&data.resolvedUrl){lines.push(lang==='ar'?`🔗 تم فك الرابط المختصر: ${data.resolvedUrl}`:`🔗 Lien raccourci déplié : ${data.resolvedUrl}`)}if(data.typosquatting&&data.typosquatting.suspected){lines.push(lang==='ar'?`⚠️ تنبيه انتحال: هذا النطاق (${data.domain}) يقلد الموقع الرسمي (${data.typosquatting.targetOfficialDomain})`:`⚠️ Alerte Usurpation : ce domaine (${data.domain}) imite le site officiel ${data.typosquatting.targetOfficialDomain}`)}if(data.status==='malicious'||data.status==='suspicious'){box.className='live danger';lines.push(lang==='ar'?`تحذير VirusTotal: ${data.stats.malicious} كشف ضار و${data.stats.suspicious} مشبوه.`:`Alerte VirusTotal : ${data.stats.malicious} moteur(s) malveillant(s), ${data.stats.suspicious} suspect(s).`)}else if(data.status==='no_detection'){box.className=lines.some(l=>l.includes('⚠️'))?'live danger':'live good';lines.push(lang==='ar'?'لم يسجل VirusTotal أي كشف في آخر تحليل. هذا لا يضمن أن الرابط آمن.':'Aucune détection lors de la dernière analyse VirusTotal. Cela ne garantit pas que le lien soit sûr.')}else{box.className='live';lines.push(lang==='ar'?'لا يوجد تحليل سابق لهذا الرابط لدى VirusTotal.':'VirusTotal ne possède pas encore d’analyse pour ce lien.')}box.innerText=lines.join('\n\n')}catch{box.className='live';box.textContent=lang==='ar'?'الفحص المباشر غير متاح؛ التحليل المحلي فقط.':'Vérification en direct indisponible ; analyse locale uniquement.'}}
function handleFeedback(val){$('#fbMsg').textContent=ui[lang].fbThanks;let fbHistory=JSON.parse(localStorage.getItem('dalil-feedback')||'[]');fbHistory.push({val,claim:claim.value.slice(0,100),date:Date.now()});localStorage.setItem('dalil-feedback',JSON.stringify(fbHistory))}
$('#fbUseful').onclick=()=>handleFeedback('useful');$('#fbIncorrect').onclick=()=>handleFeedback('incorrect');$('#fbUncertain').onclick=()=>handleFeedback('uncertain');
function analyze(){if(!claim.value.trim())return;let key=Object.keys(cases).find(k=>cases[k].test.test(claim.value))||'generic';render(key);void checkLive(firstLink(claim.value));let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');h.unshift({text:claim.value.slice(0,120),type:key,date:Date.now()});localStorage.setItem('dalil-history',JSON.stringify(h.slice(0,20)));stats();result.classList.add('show');result.scrollIntoView({behavior:'smooth'})}
if($('#statChecks'))$('#statChecks').onclick=()=>{$('#historyDrawer').classList.toggle('show');renderHistory();};if($('#clearHist'))$('#clearHist').onclick=()=>{localStorage.removeItem('dalil-history');stats();};$('#lang').onclick=()=>translate(lang==='fr'?'ar':'fr');function handleOcrFile(file){if(!file||!file.type.startsWith('image/'))return;var statusBox=$('#ocrStatus');statusBox.style.display='block';statusBox.textContent=ui[lang].ocrLoading;if(typeof Tesseract==='undefined'){statusBox.textContent=ui[lang].ocrError;return;}Tesseract.recognize(file,lang==='ar'?'ara+fra':'fra+ara',{logger:function(m){if(m.status==='recognizing text'&&m.progress){statusBox.textContent=ui[lang].ocrLoading+' ('+Math.round(m.progress*100)+'%)';}}}).then(function(res){statusBox.style.display='none';if(res&&res.data&&res.data.text){var extracted=res.data.text.trim();if(extracted){extracted=extracted.replace(/(https?:\/\/[^\s<>'"\n]+)-\s*[\r\n]+\s*([a-zA-Z0-9\-]+\.[a-zA-Z]{2,})/gi,'$1$2').replace(/(https?:\/\/[^\s<>'"\n]+)\s*[\r\n]+\s*([a-zA-Z0-9\-]+\.[a-zA-Z]{2,})/gi,'$1/$2');claim.value=extracted;analyze();}}}).catch(function(){statusBox.textContent=ui[lang].ocrError;});}if($('#btnOcr'))$('#btnOcr').onclick=function(){$('#imageInput').click();};if($('#imageInput'))$('#imageInput').onchange=function(e){if(e.target.files&&e.target.files[0])handleOcrFile(e.target.files[0]);};$('#example').onclick=()=>claim.value=ui[lang].sample+' https://tinyurl.com/exemple-arnaque';$('#go').onclick=analyze;$('#copyReply').onclick=async()=>{try{await navigator.clipboard.writeText($('#replyText').textContent);$('#copyReply').textContent=extra[lang].copied}catch{$('#copyReply').textContent=extra[lang].copy}};document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{feedback.textContent=b.dataset.good?ui[lang].good:ui[lang].bad;if(b.dataset.good){localStorage.setItem('dalil-skills',Math.min(99,+localStorage.getItem('dalil-skills')+1));stats()}});$('#reset').onclick=()=>{claim.value='';result.classList.remove('show');feedback.textContent='';scrollTo({top:0,behavior:'smooth'})};
if($('#btnReportScam'))$('#btnReportScam').onclick=function(){$('#reportText').value=claim.value;$('#reportMsg').textContent='';$('#reportModal').style.display='grid';};if($('#btnCancelReport'))$('#btnCancelReport').onclick=function(){$('#reportModal').style.display='none';};if($('#btnSendReport'))$('#btnSendReport').onclick=async function(){var text=$('#reportText').value.trim();if(!text)return;var domain=firstLink(text)||'';try{var res=await fetch('/api/reports',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text,domain:domain,category:'scam'})});var json=await res.json();if(json.success){$('#reportMsg').textContent=ui[lang].reportThanks;setTimeout(function(){$('#reportModal').style.display='none';},1800);}else{$('#reportMsg').textContent='⚠️ '+json.error;}}catch(e){$('#reportMsg').textContent="⚠️ Échec d'envoi";}};
translate(lang);stats();
</script></body></html>

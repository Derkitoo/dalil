<!doctype html><html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dalil — Apprendre à vérifier</title>
<style>
:root{--ink:#14231d;--paper:#f4f0e7;--card:#fbf8f1;--green:#175f48;--mint:#cce3d3;--orange:#ef794f;--line:#cec9bd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.top{max-width:1100px;margin:auto;padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.lang{border:1px solid var(--ink);background:transparent;border-radius:20px;padding:7px 14px;font-weight:800}.stats{max-width:880px;margin:28px auto 0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#e8eee5}.stat{padding:12px;text-align:center;border-inline-end:1px solid var(--line)}.stat:last-child{border:0}.stat strong{display:block;font:24px Georgia;color:var(--green)}.stat span{font-size:11px;color:#667169}.hero{max-width:880px;margin:auto;padding:55px 20px 70px;text-align:center}.eyebrow{font-size:12px;font-weight:800;color:var(--green)}h1{font:clamp(47px,8vw,80px)/1 Georgia,serif;margin:20px 0}h1 em{color:var(--green);font-weight:400}.intro{max-width:650px;margin:0 auto 30px;color:#4e5b54;line-height:1.8;font-size:18px}.box,.result{background:var(--card);border:1px solid var(--line);padding:26px;text-align:start}.box{box-shadow:9px 10px 0 #d9ded2}.box label{display:block;font-weight:800;margin-bottom:12px}textarea{width:100%;padding:16px;border:1px solid #aaa;background:white;line-height:1.7;resize:vertical}.actions{display:flex;gap:10px;margin-top:12px}.primary{flex:1;background:var(--green);color:#fff;border:0;padding:14px;font-weight:800}.secondary{border:1px solid var(--line);background:transparent;padding:14px 20px}.note,.warning{font-size:11px;color:#6e7771}.note{margin-top:12px}.result{display:none;margin-top:36px}.result.show{display:block}.head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.head h2{font:38px Georgia;color:#a23f26;margin:6px 0}.confidence{width:78px;height:78px;background:var(--mint);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:800}.verdict{font-size:17px;line-height:1.8;padding:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}article{padding:18px;border-inline-end:1px solid var(--line)}article:last-child{border:0}article span{color:var(--orange)}article h3{margin:8px 0}article p{font-size:13px;line-height:1.65;color:#59645e}.sources{margin-top:20px;border:1px solid var(--line);padding:17px}.sources h3{margin:0 0 8px}.source{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}.source a{color:var(--green);font-weight:800}.source small{color:#6d756f}.warning{margin-top:18px;background:#ede7d9;padding:10px}.lesson{margin-top:20px;background:var(--ink);color:white;padding:24px}.lesson small{color:#8fceb0}.choices{display:grid;gap:8px}.choices button{text-align:start;background:#25352e;color:white;border:1px solid #53635b;padding:12px}.feedback{color:#cfe2d6}.reset{display:block;margin:20px auto 0;border:0;background:transparent;color:var(--green);font-weight:800}@media(max-width:650px){.hero{padding-top:40px}.actions{flex-direction:column}.result{padding:17px}.grid{grid-template-columns:1fr}article{border-inline-end:0;border-bottom:1px solid var(--line)}.head h2{font-size:28px}.source{flex-direction:column;gap:5px}.stats{margin-inline:16px}}
</style></head><body>
<header class="top"><div class="brand" id="brand"></div><button class="lang" id="lang"></button></header>
<div class="stats"><div class="stat"><strong id="checks">0</strong><span id="checksLabel"></span></div><div class="stat"><strong id="skills">0</strong><span id="skillsLabel"></span></div><div class="stat"><strong>1</strong><span id="streakLabel"></span></div></div>
<main class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="intro" id="intro"></p>
<section class="box"><label id="claimLabel" for="claim"></label><textarea id="claim" rows="4"></textarea><div class="actions"><button class="primary" id="go"></button><button class="secondary" id="example"></button></div><div class="note" id="privacy"></div></section>
<section class="result" id="result"><div class="head"><div><small class="eyebrow" id="resultLabel"></small><h2 id="resultTitle"></h2></div><div class="confidence" id="confidence"></div></div><p class="verdict" id="verdict"></p>
<div class="grid"><article><span>01</span><h3 id="knownTitle"></h3><p id="knownText"></p></article><article><span>02</span><h3 id="riskTitle"></h3><p id="riskText"></p></article><article><span>03</span><h3 id="missingTitle"></h3><p id="missingText"></p></article></div>
<div class="sources"><h3 id="sourcesTitle"></h3><div id="sourceList"></div></div><div class="warning" id="warning"></div>
<div class="lesson"><small id="lessonLabel"></small><h3 id="question"></h3><div class="choices"><button data-good="1" id="choice1"></button><button id="choice2"></button><button id="choice3"></button></div><p class="feedback" id="feedback"></p></div><button class="reset" id="reset"></button></section></main>
<script>
const $=s=>document.querySelector(s), claim=$('#claim'), result=$('#result'), feedback=$('#feedback');let lang=localStorage.getItem('dalil-language')||'fr', active=null;
const ui={fr:{brand:'◉ Dalil',toggle:'AR',eyebrow:'● Réfléchir avant de partager',title:'Ne me crois pas.<br><em>Apprends à vérifier.</em>',intro:'Envoie une information ou une affirmation. Dalil repère les risques, indique les preuves nécessaires et t’apprend à enquêter.',label:'Quelle information veux-tu vérifier ?',placeholder:'Colle un message ou une affirmation ici…',go:'Lancer l’analyse →',example:'Essayer une arnaque',privacy:'◆ Cette version analyse le texte sur ton appareil',result:'Analyse préliminaire',confidence:'Analyse<br>initiale',known:'Ce que nous savons',risk:'Signal de risque',missing:'Ce qui manque',sources:'Sources à consulter',warning:'Analyse d’orientation : ce prototype ne consulte pas encore les sources en direct et ne fournit pas de verdict définitif.',lesson:'Apprendre en 20 secondes',reset:'Vérifier une autre information →',checks:'Vérifications',skills:'Compétences acquises',streak:'Jour de série',open:'Ouvrir la source',good:'Bravo. Ce choix réduit le risque et améliore la qualité des preuves.',bad:'Essaie encore : choisis l’action qui permet une vérification indépendante.',sample:'Félicitations ! Tu as gagné un prix. Clique vite sur ce lien et envoie le code de ton compte.'},ar:{brand:'◉ دليل',toggle:'FR',eyebrow:'● فكّر قبل أن تنشر',title:'لا تصدّقني.<br><em>تعلّم كيف تتحقّق.</em>',intro:'أرسل معلومة أو ادّعاءً. يكتشف دليل المخاطر ويحدد الأدلة اللازمة ويعلّمك كيف تحقق بنفسك.',label:'ما المعلومة التي تريد التحقّق منها؟',placeholder:'الصق رسالة أو ادّعاءً هنا…',go:'ابدأ التحليل ←',example:'جرّب رسالة احتيال',privacy:'◆ هذه النسخة تحلل النص على جهازك',result:'تحليل أولي',confidence:'تحليل<br>أولي',known:'ما نعرفه',risk:'علامة الخطر',missing:'ما الذي ينقص؟',sources:'مصادر للمتابعة',warning:'تحليل توجيهي: هذا النموذج لا يستشير المصادر مباشرة بعد ولا يقدم حكمًا نهائيًا.',lesson:'تعلّم في 20 ثانية',reset:'تحقّق من معلومة أخرى ←',checks:'تحقيقات',skills:'مهارات مكتسبة',streak:'يوم متتالٍ',open:'فتح المصدر',good:'أحسنت. هذا الاختيار يقلل المخاطر ويحسن جودة الأدلة.',bad:'حاول مجددًا: اختر الخطوة التي تسمح بتحقق مستقل.',sample:'تهانينا! ربحت جائزة. اضغط بسرعة على الرابط وأرسل رمز حسابك.'}};
const cases={scam:{test:/ربح|جائزة|تحويل|حساب|بنك|رابط|واتساب|gagn|prix|banque|compte|lien|whatsapp/i,fr:{title:'Forts indices de tentative d’arnaque',verdict:'Le message combine urgence, promesse de gain et demande sensible. Ne clique pas et ne transmets aucun code : vérifie par le canal officiel.',facts:['Urgence et récompense sont des leviers fréquents des escrocs.','Un nom ou un logo ne prouve pas l’identité de l’expéditeur.','Il faut contrôler le domaine et joindre l’organisme officiellement.'],question:'Quel est le premier geste sûr ?',choices:['Ouvrir soi-même le site officiel','Cliquer rapidement sur le lien','Envoyer son code de confirmation'],sources:[['INTERPOL — criminalité financière','https://www.interpol.int/fr/Infractions/Criminalite-financiere','Conseils de sécurité'],['Google Safe Browsing','https://transparencyreport.google.com/safe-browsing/search','Contrôle de liens']]},ar:{title:'مؤشرات قوية على محاولة احتيال',verdict:'تجمع الرسالة بين الاستعجال والوعد بمكسب وطلب حساس. لا تضغط الرابط ولا ترسل أي رمز؛ تحقق عبر القناة الرسمية.',facts:['الاستعجال والمكسب من أساليب الاحتيال الشائعة.','اسم المؤسسة أو شعارها لا يثبت هوية المرسل.','يجب فحص النطاق والتواصل مع المؤسسة رسميًا.'],question:'ما أول تصرف آمن؟',choices:['فتح الموقع الرسمي بنفسك','الضغط بسرعة على الرابط','إرسال رمز التحقق'],sources:[['الإنتربول — الجرائم المالية','https://www.interpol.int/ar/4/4/','إرشادات أمنية'],['Google Safe Browsing','https://transparencyreport.google.com/safe-browsing/search','فحص الروابط']]}},health:{test:/ماء|فيروس|صحة|دواء|مرض|water|eau|virus|santé|médicament|maladie/i,fr:{title:'Cette affirmation de santé exige des preuves',verdict:'Une recommandation médicale ne devient pas vraie parce qu’elle semble logique. Une étude clinique ou une autorité sanitaire fiable est nécessaire.',facts:['La chaleur peut agir sur des virus en laboratoire.','Un résultat de laboratoire ne devient pas automatiquement un traitement humain.','Il faut un essai clinique et une recommandation sanitaire.'],question:'Quelle preuve est la plus solide ?',choices:['Une étude clinique publiée','Un message très partagé','Une expérience personnelle'],sources:[['Organisation mondiale de la Santé','https://www.who.int/fr','Source sanitaire officielle'],['PubMed','https://pubmed.ncbi.nlm.nih.gov/','Recherche scientifique']]},ar:{title:'الادّعاء الصحي يحتاج إلى دليل',verdict:'لا تصبح النصيحة الطبية صحيحة لمجرد أنها تبدو منطقية. نحتاج إلى دراسة سريرية أو توصية من هيئة صحية موثوقة.',facts:['قد تؤثر الحرارة في الفيروسات مخبريًا.','النتيجة المخبرية لا تصبح تلقائيًا علاجًا للبشر.','نحتاج إلى تجربة سريرية وتوصية صحية.'],question:'أي دليل هو الأقوى؟',choices:['دراسة سريرية منشورة','رسالة منتشرة جدًا','تجربة شخصية'],sources:[['منظمة الصحة العالمية','https://www.who.int/ar','مصدر صحي رسمي'],['PubMed','https://pubmed.ncbi.nlm.nih.gov/','أبحاث علمية']]}},generic:{test:/.*/,fr:{title:'Pas assez de preuves pour conclure',verdict:'Cette affirmation manque de détails ou de source primaire. Identifie l’auteur, la date et une preuve vérifiable avant de conclure.',facts:['Nous avons une affirmation, mais aucune preuve visible.','La popularité ne garantit pas la vérité.','Il faut retrouver la source et le contexte d’origine.'],question:'Quelle est la meilleure prochaine étape ?',choices:['Rechercher la source originale','Compter les partages','Croire le ton assuré'],sources:[['Recherche avancée Google','https://www.google.com/advanced_search','Retrouver la source'],['Internet Archive','https://archive.org/web/','Historique des pages']]},ar:{title:'لا توجد أدلة كافية للحكم',verdict:'يفتقر هذا الادعاء إلى التفاصيل أو المصدر الأصلي. حدد المؤلف والتاريخ ودليلًا قابلًا للتحقق قبل الحكم.',facts:['لدينا ادعاء، لكن لا يوجد دليل ظاهر.','الانتشار لا يساوي الصحة.','نحتاج إلى المصدر الأصلي وسياق النشر.'],question:'ما أفضل خطوة تالية؟',choices:['البحث عن المصدر الأصلي','عدّ مرات المشاركة','الثقة في النبرة الواثقة'],sources:[['بحث Google المتقدم','https://www.google.com/advanced_search','العثور على المصدر'],['Internet Archive','https://archive.org/web/','تاريخ الصفحات']]}}};
function stats(){let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');$('#checks').textContent=h.length;$('#skills').textContent=localStorage.getItem('dalil-skills')||0}
function translate(next){lang=next;localStorage.setItem('dalil-language',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';let t=ui[lang];$('#brand').textContent=t.brand;$('#lang').textContent=t.toggle;$('#eyebrow').textContent=t.eyebrow;$('#title').innerHTML=t.title;$('#intro').textContent=t.intro;$('#claimLabel').textContent=t.label;claim.placeholder=t.placeholder;$('#go').textContent=t.go;$('#example').textContent=t.example;$('#privacy').textContent=t.privacy;$('#resultLabel').textContent=t.result;$('#confidence').innerHTML=t.confidence;$('#knownTitle').textContent=t.known;$('#riskTitle').textContent=t.risk;$('#missingTitle').textContent=t.missing;$('#sourcesTitle').textContent=t.sources;$('#warning').textContent=t.warning;$('#lessonLabel').textContent=t.lesson;$('#reset').textContent=t.reset;$('#checksLabel').textContent=t.checks;$('#skillsLabel').textContent=t.skills;$('#streakLabel').textContent=t.streak;feedback.textContent='';if(active)render(active)}
function render(key){active=key;let s=cases[key][lang],t=ui[lang];$('#resultTitle').textContent=s.title;$('#verdict').textContent=s.verdict;$('#knownText').textContent=s.facts[0];$('#riskText').textContent=s.facts[1];$('#missingText').textContent=s.facts[2];$('#question').textContent=s.question;['#choice1','#choice2','#choice3'].forEach((id,i)=>$(id).textContent=s.choices[i]);$('#sourceList').innerHTML=s.sources.map(x=>`<div class="source"><div><strong>${x[0]}</strong><br><small>${x[2]}</small></div><a target="_blank" rel="noopener" href="${x[1]}">${t.open} ↗</a></div>`).join('')}
function analyze(){if(!claim.value.trim())return;let key=Object.keys(cases).find(k=>cases[k].test.test(claim.value))||'generic';render(key);let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');h.unshift({text:claim.value.slice(0,120),type:key,date:Date.now()});localStorage.setItem('dalil-history',JSON.stringify(h.slice(0,20)));stats();result.classList.add('show');result.scrollIntoView({behavior:'smooth'})}
$('#lang').onclick=()=>translate(lang==='fr'?'ar':'fr');$('#example').onclick=()=>claim.value=ui[lang].sample;$('#go').onclick=analyze;document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{feedback.textContent=b.dataset.good?ui[lang].good:ui[lang].bad;if(b.dataset.good){localStorage.setItem('dalil-skills',Math.min(99,+localStorage.getItem('dalil-skills')+1));stats()}});$('#reset').onclick=()=>{claim.value='';result.classList.remove('show');feedback.textContent='';scrollTo({top:0,behavior:'smooth'})};translate(lang);stats();
</script></body></html>

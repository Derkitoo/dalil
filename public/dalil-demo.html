function inspectLinks(text){let e=extra[lang],found=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/gi)||[];found=[...new Set(found.map(x=>x.replace(/[),.;!?،؛]+$/,'')))];if(!found.length){$('#linkList').innerHTML=`<p class="note">${e.noLink}</p>`;return 0}let totalRisk=0;$('#linkList').innerHTML=found.map(raw=>{try{let value=/^https?:/i.test(raw)?raw:'https://'+raw,url=new URL(value),host=url.hostname.toLowerCase(),flags=[],official=officialDomains.some(d=>host===d||host.endsWith('.'+d));if(url.protocol==='http:'){flags.push([e.http,'risk']);totalRisk++}else flags.push([e.https,'safe']);if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host)){flags.push([e.ip,'risk']);totalRisk++}if(host.includes('xn--')){flags.push([e.puny,'risk']);totalRisk++}if(shorteners.includes(host)){flags.push([e.short,'risk']);totalRisk++}if(raw.includes('@')){flags.push([e.at,'risk']);totalRisk++}if(host.length>35){flags.push([e.long,'risk']);totalRisk++}flags.push([official?e.official:e.unknown,official?'safe':'']);return `<div class="urlrow"><div class="domain">${host}</div><div class="badges">${flags.map(f=>`<span class="badge ${f[1]}">${f[0]}</span>`).join('')}</div></div>`}catch{return ''}}).join('');return totalRisk}
function render(key){active=key;let s=cases[key][lang],t=ui[lang],e=extra[lang];$('#resultTitle').textContent=s.title;$('#verdict').textContent=s.verdict;$('#knownText').textContent=s.facts[0];$('#riskText').textContent=s.facts[1];$('#missingText').textContent=s.facts[2];$('#question').textContent=s.question;['#choice1','#choice2','#choice3'].forEach((id,i)=>$(id).textContent=s.choices[i]);$('#sourceList').innerHTML=s.sources.map(x=>`<div class="source"><div><strong>${x[0]}</strong><br><small>${x[2]}</small></div><a target="_blank" rel="noopener" href="${x[1]}">${t.open} ↗</a></div>`).join('');let risks=inspectLinks(claim.value);$('#replyText').textContent=(key==='scam'||risks>0)?e.replyRisk:e.replySafe;$('#copyReply').textContent=e.copy}
function firstLink(text){let found=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/i);if(!found)return null;let raw=found[0].replace(/[),.;!?،؛]+$/,'');return /^https?:/i.test(raw)?raw:'https://'+raw}
async function checkLive(candidate){var box=document.querySelector('#liveStatus');if(!candidate){box.className='live';box.textContent=lang==='ar'?'أضف رابطًا للفحص.':'Ajoute un lien pour la vérification en direct.';return}box.className='live checking';box.textContent=lang==='ar'?'جارٍ VirusTotal…':'Vérification VirusTotal en cours…';document.querySelector('#resultLabel').textContent=lang==='ar'?'● جارٍ…':'● En cours…';document.querySelector('#confidence').innerHTML=lang==='ar'?'⏳<br>جارٍ':'⏳<br>en cours';try{var resp=await fetch('/api/reputation?url='+encodeURIComponent(candidate),{headers:{accept:'application/json'}});if(!resp.ok)throw new Error('http-'+resp.status);var data=await resp.json();apiData=data;applyApiResult(data);var isFr=lang==='fr',lines=[];if(data.unshortened&&data.resolvedUrl){lines.push((isFr?'🔗 Lien déplié : ':'🔗 رابط مفكوك: ')+data.resolvedUrl);}if(data.typosquatting&&data.typosquatting.suspected){lines.push((isFr?'⚠️ « ':'⚠️ « ')+data.domain+(isFr?' » imite « ':' » يُقلّد « ')+data.typosquatting.targetOfficialDomain+' »');}if(data.status==='malicious'||data.status==='suspicious'){box.className='live danger';var n=((data.stats&&data.stats.malicious)||0)+((data.stats&&data.stats.suspicious)||0);lines.push(isFr?'🚨 '+n+' moteur(s) ont signalé ce lien dangereux.':'🚨 '+n+' محرك صنّف هذا الرابط خطيرًا.');}else if(data.status==='no_detection'){box.className=(data.typosquatting&&data.typosquatting.suspected)?'live danger':'live good';lines.push(isFr?'Aucune détection VirusTotal. Restez vigilant.':'لا كشوف VirusTotal. ابقَ حذرًا.');}else{box.className='live';lines.push(isFr?'VirusTotal ne possède pas encore d\'analyse pour ce lien.':'لا يوجد تحليل سابق لهذا الرابط.');}box.innerText=lines.join('\n\n');}catch(err){box.className='live';box.textContent=lang==='ar'?'الفحص غير متاح.':' Vérification indisponible.';document.querySelector('#resultLabel').textContent=lang==='ar'?'● تحليل محلي':'● Analyse locale';document.querySelector('#confidence').innerHTML=ui[lang].confidence;}});if(!response.ok)throw new Error('unavailable');let data=await response.json();let lines=[];if(data.unshortened&&data.resolvedUrl){lines.push(lang==='ar'?`🔗 تم فك الرابط المختصر: ${data.resolvedUrl}`:`🔗 Lien raccourci déplié : ${data.resolvedUrl}`)}if(data.typosquatting&&data.typosquatting.suspected){lines.push(lang==='ar'?`⚠️ تنبيه انتحال: هذا النطاق (${data.domain}) يقلد الموقع الرسمي (${data.typosquatting.targetOfficialDomain})`:`⚠️ Alerte Usurpation : ce domaine (${data.domain}) imite le site officiel ${data.typosquatting.targetOfficialDomain}`)}if(data.status==='malicious'||data.status==='suspicious'){box.className='live danger';lines.push(lang==='ar'?`تحذير VirusTotal: ${data.stats.malicious} كشف ضار و${data.stats.suspicious} مشبوه.`:`Alerte VirusTotal : ${data.stats.malicious} moteur(s) malveillant(s), ${data.stats.suspicious} suspect(s).`)}else if(data.status==='no_detection'){box.className=lines.some(l=>l.includes('⚠️'))?'live danger':'live good';lines.push(lang==='ar'?'لم يسجل VirusTotal أي كشف في آخر تحليل. هذا لا يضمن أن الرابط آمن.':'Aucune détection lors de la dernière analyse VirusTotal. Cela ne garantit pas que le lien soit sûr.')}else{box.className='live';lines.push(lang==='ar'?'لا يوجد تحليل سابق لهذا الرابط لدى VirusTotal.':'VirusTotal ne possède pas encore d’analyse pour ce lien.')}box.innerText=lines.join('\n\n')}catch{box.className='live';box.textContent=lang==='ar'?'الفحص المباشر غير متاح؛ التحليل المحلي فقط.':'Vérification en direct indisponible ; analyse locale uniquement.'}}
function handleFeedback(val){$('#fbMsg').textContent=ui[lang].fbThanks;let fbHistory=JSON.parse(localStorage.getItem('dalil-feedback')||'[]');fbHistory.push({val,claim:claim.value.slice(0,100),date:Date.now()});localStorage.setItem('dalil-feedback',JSON.stringify(fbHistory))}
$('#fbUseful').onclick=()=>handleFeedback('useful');$('#fbIncorrect').onclick=()=>handleFeedback('incorrect');$('#fbUncertain').onclick=()=>handleFeedback('uncertain');
function analyze(){if(!claim.value.trim())return;let key=Object.keys(cases).find(k=>cases[k].test.test(claim.value))||'generic';render(key);void checkLive(firstLink(claim.value));let h=JSON.parse(localStorage.getItem('dalil-history')||'[]');h.unshift({text:claim.value.slice(0,120),type:key,date:Date.now()});localStorage.setItem('dalil-history',JSON.stringify(h.slice(0,20)));stats();result.classList.add('show');result.scrollIntoView({behavior:'smooth'})}
$('#lang').onclick=()=>translate(lang==='fr'?'ar':'fr');$('#example').onclick=()=>claim.value=ui[lang].sample+' https://tinyurl.com/exemple-arnaque';$('#go').onclick=analyze;$('#copyReply').onclick=async()=>{try{await navigator.clipboard.writeText($('#replyText').textContent);$('#copyReply').textContent=extra[lang].copied}catch{$('#copyReply').textContent=extra[lang].copy}};document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{feedback.textContent=b.dataset.good?ui[lang].good:ui[lang].bad;if(b.dataset.good){localStorage.setItem('dalil-skills',Math.min(99,+localStorage.getItem('dalil-skills')+1));stats()}});$('#reset').onclick=()=>{apiData=null;claim.value='';result.classList.remove('show');feedback.textContent='';scrollTo({top:0,behavior:'smooth'})};translate(lang);stats();
</script>
